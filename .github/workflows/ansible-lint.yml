---
# ==============================================================================
# Reusable Workflow: Ansible Lint
# ==============================================================================
# Purpose:
#   Validates YAML syntax and Ansible coding standards using yamllint and
#   ansible-lint.
#
# Inputs:
#   ansible-lint-profile: ansible-lint profile (e.g., shared, production)
#   python-version: Python version to use
#   requirements-ci-file: Path to CI requirements.txt for pinned tool versions (empty = use defaults)
#   enable-galaxy-metadata-check: [DEPRECATED] Moved to ansible-meta-validate.yml — this input is ignored
#   runner-group: Runner group to execute jobs on. Ignored when 'runner' is set.
#   runner: Explicit runner label. Overrides 'runner-group' when non-empty.
# ==============================================================================

name: "Ansible Lint"

on:
  workflow_call:
    inputs:
      ansible-lint-profile:
        description: "ansible-lint profile (e.g., shared, production)"
        type: string
        default: "production"
      python-version:
        description: "Python version to use"
        type: string
        default: "3.12"
      requirements-ci-file:
        description: "Path to CI requirements.txt for pinned tool versions (empty = use defaults)"
        type: string
        default: ""
      enable-galaxy-metadata-check:
        description: "[DEPRECATED] Moved to ansible-meta-validate.yml — this input is ignored"
        type: boolean
        default: true
      runner-group:
        description: "Runner group to execute jobs on. Ignored when 'runner' is set."
        type: string
        default: ""
      runner:
        description: "Explicit runner label. Overrides 'runner-group' when non-empty."
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  # ================================================================
  # 1. YAML SYNTAX VALIDATION
  # ================================================================
  yaml-lint:
    name: "🔍 Validate YAML Syntax"
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.runner-group != '' && fromJSON(format('{{"group":"{0}"}}', inputs.runner-group)) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: "🔍 Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "⚙️ Set up Python ${{ inputs.python-version }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: "⚙️ Cache pip"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ inputs.python-version }}-

      # Pinned version for reproducibility; bump deliberately (Dependabot does not track these — manual review cadence)
      - name: "⚙️ Install yamllint"
        env:
          REQUIREMENTS_CI_FILE: ${{ inputs.requirements-ci-file }}
        run: |
          if [ -n "$REQUIREMENTS_CI_FILE" ] && [ -f "$REQUIREMENTS_CI_FILE" ]; then
            pip install -r "$REQUIREMENTS_CI_FILE"
          else
            pip install yamllint==1.38.0
          fi

      - name: "🔍 Lint YAML files"
        run: yamllint .

  # ================================================================
  # 2. ANSIBLE LINT
  # ================================================================
  ansible-lint:
    name: "🔍 Validate Ansible Coding Standards"
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.runner-group != '' && fromJSON(format('{{"group":"{0}"}}', inputs.runner-group)) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: "🔍 Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "⚙️ Set up Python ${{ inputs.python-version }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: "⚙️ Cache pip"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ inputs.python-version }}-

      # Pinned version for reproducibility; bump deliberately (Dependabot does not track these — manual review cadence)
      - name: "⚙️ Install ansible-lint"
        env:
          REQUIREMENTS_CI_FILE: ${{ inputs.requirements-ci-file }}
        run: |
          if [ -n "$REQUIREMENTS_CI_FILE" ] && [ -f "$REQUIREMENTS_CI_FILE" ]; then
            pip install -r "$REQUIREMENTS_CI_FILE"
          else
            pip install ansible-lint==26.9.0 ansible-core==2.21.4
          fi

      - name: "🔍 Run ansible-lint"
        env:
          ANSIBLE_LINT_PROFILE: ${{ inputs.ansible-lint-profile }}
        run: ansible-lint --profile "$ANSIBLE_LINT_PROFILE" .

  # ================================================================
  # 3. LINT GATE
  # ================================================================
  lint-gate:
    name: "✅ Lint Gate"
    needs: [yaml-lint, ansible-lint]
    if: always()
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.runner-group != '' && fromJSON(format('{{"group":"{0}"}}', inputs.runner-group)) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: "⚙️ Evaluate results"
        env:
          YAML_LINT_RESULT: ${{ needs.yaml-lint.result }}
          ANSIBLE_LINT_RESULT: ${{ needs.ansible-lint.result }}
        run: |
          echo "YAML Lint:        $YAML_LINT_RESULT"
          echo "Ansible Lint:     $ANSIBLE_LINT_RESULT"

          has_failures=0

          if [[ "$YAML_LINT_RESULT" == "failure" || "$YAML_LINT_RESULT" == "cancelled" ]]; then
            echo "::error::YAML Lint failed or was cancelled"
            has_failures=1
          fi

          if [[ "$ANSIBLE_LINT_RESULT" == "failure" || "$ANSIBLE_LINT_RESULT" == "cancelled" ]]; then
            echo "::error::Ansible Lint failed or was cancelled"
            has_failures=1
          fi

          if [[ "$has_failures" -ne 0 ]]; then
            exit 1
          fi

          echo "All lint validations passed successfully"
