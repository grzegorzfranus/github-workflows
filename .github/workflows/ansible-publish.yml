---
name: "Ansible Galaxy Publish"

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use"
        type: string
        default: "3.12"
      runner-group:
        description: "Runner group to execute jobs on. Ignored when 'runner' is set."
        type: string
        default: ""
      runner:
        description: "Explicit runner label. Overrides 'runner-group' when non-empty."
        type: string
        default: "ubuntu-latest"
    secrets:
      galaxy-api-key:
        description: "Ansible Galaxy API Key"
        required: true

permissions:
  contents: read

# Metadata validation is performed by the caller workflow using
# ansible-meta-validate.yml before invoking this workflow.
jobs:
  # ================================================================
  # 1. PUBLISH TO GALAXY
  # ================================================================
  publish-galaxy:
    name: "📦 Publish to Galaxy"
    runs-on: ${{ inputs.runner != '' && inputs.runner || fromJSON(format('{{"group":"{0}"}}', inputs.runner-group)) }}
    timeout-minutes: 15
    steps:
      - name: "🔍 Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "⚙️ Set up Python ${{ inputs.python-version }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: "⚙️ Cache pip"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ inputs.python-version }}-

      - name: "⚙️ Install ansible-core"
        run: pip install ansible-core

      - name: "📦 Upload to Ansible Galaxy"
        env:
          GALAXY_API_KEY: ${{ secrets.galaxy-api-key }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          owner=$(echo "$GH_REPOSITORY" | cut -d/ -f1)
          repo=$(echo "$GH_REPOSITORY" | cut -d/ -f2)

          max_attempts=3
          attempt=1
          success=false

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts: Importing role $owner.$repo to Ansible Galaxy..."
            if ansible-galaxy role import --api-key "$GALAXY_API_KEY" "$owner" "$repo"; then
              success=true
              break
            else
              echo "Error: Import failed."
              if [ $attempt -lt $max_attempts ]; then
                sleep_time=$((attempt * 15))
                echo "Waiting $sleep_time seconds before retry..."
                sleep $sleep_time
              fi
            fi
            attempt=$((attempt + 1))
          done

          if [ "$success" = false ]; then
            echo "::error::Failed to publish role after $max_attempts attempts."
            exit 1
          fi
