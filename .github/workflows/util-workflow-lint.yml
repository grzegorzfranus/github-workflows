---
# ==============================================================================
# Reusable Workflow: Workflow Lint
# ==============================================================================
# Purpose:
#   Validates GitHub Actions workflows across caller repositories using
#   yamllint (syntax), actionlint (schema/expressions), and zizmor (security).
#   Tool versions are pinned for reproducibility (yamllint 1.38.0, zizmor 1.28.0, pyflakes 3.4.0, shellcheck-py 0.11.0.1)
#   and bumped deliberately.
#   The tools are installed by the workflow, so the runner needs only Python support through actions/setup-python.
#
# Inputs:
#   paths: Space-separated git pathspec globs; linting runs only when a pull request changes a matching file (empty = always lint)
#   yamllint-config: Path to a yamllint config in the caller repository (empty = the caller .yamllint, else the github-workflows default)
#   python-version: Python version used to install yamllint, zizmor, pyflakes and shellcheck
#   runner-group: Runner group to execute jobs on. Ignored when 'runner' is set.
#   runner: Explicit runner label. Overrides 'runner-group' when non-empty.
# ==============================================================================

name: "Workflow Lint"

on:
  workflow_call:
    inputs:
      paths:
        description: "Space-separated git pathspec globs; linting runs only when a pull request changes a matching file (empty = always lint)"
        type: string
        default: ".github/**"
      yamllint-config:
        description: "Path to a yamllint config in the caller repository (empty = the caller .yamllint, else the github-workflows default)"
        type: string
        default: ""
      python-version:
        description: "Python version used to install yamllint, zizmor, pyflakes and shellcheck"
        type: string
        default: "3.12"
      runner-group:
        description: "Runner group to execute jobs on. Ignored when 'runner' is set."
        type: string
        default: ""
      runner:
        description: "Explicit runner label. Overrides 'runner-group' when non-empty."
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  # ================================================================
  # 1. DETECT WORKFLOW CHANGES
  # ================================================================
  detect:
    name: "🔎 Detect Workflow Changes"
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.runner-group != '' && fromJSON(format('{{"group":"{0}"}}', inputs.runner-group)) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: "🔍 Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "🔎 Check changed paths"
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LINT_PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "pull_request_target" ]] || [[ -z "$LINT_PATHS" ]] || [[ -z "$BASE_SHA" ]]; then
            echo "Workflow linting will run (event=$EVENT_NAME, paths=${LINT_PATHS:-<empty>}, base_sha=${BASE_SHA:-<empty>})"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          raw_patterns=()
          read -r -a raw_patterns <<< "$LINT_PATHS"

          pathspecs=()
          for pattern in "${raw_patterns[@]}"; do
            [[ -z "$pattern" ]] && continue
            pathspecs+=(":(glob)$pattern")
          done

          if [[ ${#pathspecs[@]} -eq 0 ]]; then
            echo "No patterns specified; running workflow linting"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matched_files=$(git diff --name-only "$BASE_SHA" HEAD -- "${pathspecs[@]}")

          if [[ -n "$matched_files" ]]; then
            echo "Matched changed files:"
            echo "$matched_files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No matching files changed between $BASE_SHA and HEAD"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ================================================================
  # 2. YAML SYNTAX VALIDATION
  # ================================================================
  yaml-lint:
    name: "🔍 Validate YAML Syntax"
    needs: [detect]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.runner-group != '' && fromJSON(format('{{"group":"{0}"}}', inputs.runner-group)) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: "🔍 Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "⚙️ Set up Python ${{ inputs.python-version }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: "⚙️ Install yamllint"
        run: python -m pip install --disable-pip-version-check yamllint==1.38.0

      - name: "🔍 Lint workflow files"
        env:
          YAMLLINT_CONFIG: ${{ inputs.yamllint-config }}
        run: |
          set -euo pipefail

          config=""
          if [[ -n "$YAMLLINT_CONFIG" ]]; then
            if [[ ! -f "$YAMLLINT_CONFIG" ]]; then
              echo "::error::Specified yamllint config file not found: $YAMLLINT_CONFIG"
              exit 1
            fi
            config="$YAMLLINT_CONFIG"
          elif [[ -f ".yamllint" ]]; then
            config=".yamllint"
          else
            # Keep in sync with .yamllint in this repository.
            config="$RUNNER_TEMP/github-workflows.yamllint"
            cat <<'EOF' > "$config"
          ---
          extends: default

          rules:
            truthy: disable
            line-length:
              max: 200
              level: warning
            comments:
              min-spaces-from-content: 1
            comments-indentation: false
            braces:
              min-spaces-inside: 0
              max-spaces-inside: 1
            brackets:
              max-spaces-inside: 1
          EOF
          fi

          echo "Using yamllint config: $config"
          yamllint -c "$config" .github/workflows

  # ================================================================
  # 3. GITHUB ACTIONS SCHEMA VALIDATION
  # ================================================================
  actions-lint:
    name: "🔍 Validate GitHub Actions"
    needs: [detect]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.runner-group != '' && fromJSON(format('{{"group":"{0}"}}', inputs.runner-group)) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: "🔍 Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "⚙️ Set up Python ${{ inputs.python-version }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: "⚙️ Install pyflakes and shellcheck"
        run: |
          python -m pip install --disable-pip-version-check pyflakes==3.4.0 shellcheck-py==0.11.0.1
          pyflakes --version
          shellcheck --version

      - name: "🔍 Run actionlint"
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  # ================================================================
  # 4. WORKFLOW SECURITY AUDIT
  # ================================================================
  zizmor-scan:
    name: "🔒 Security Scan (zizmor)"
    needs: [detect]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.runner-group != '' && fromJSON(format('{{"group":"{0}"}}', inputs.runner-group)) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: "🔍 Checkout repository"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: "⚙️ Set up Python ${{ inputs.python-version }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: "⚙️ Install zizmor"
        run: python -m pip install --disable-pip-version-check zizmor==1.28.0

      - name: "🔒 Run zizmor"
        run: zizmor .github/workflows

  # ================================================================
  # 5. WORKFLOW LINT GATE
  # ================================================================
  lint-gate:
    name: "✅ Workflow Lint Gate"
    needs: [detect, yaml-lint, actions-lint, zizmor-scan]
    if: always()
    runs-on: ${{ inputs.runner != '' && inputs.runner || inputs.runner-group != '' && fromJSON(format('{{"group":"{0}"}}', inputs.runner-group)) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: "⚙️ Evaluate results"
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          DETECT_CHANGED: ${{ needs.detect.outputs.changed }}
          YAML_LINT_RESULT: ${{ needs.yaml-lint.result }}
          ACTIONS_LINT_RESULT: ${{ needs.actions-lint.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor-scan.result }}
        run: |
          echo "Detect:       $DETECT_RESULT (changed=$DETECT_CHANGED)"
          echo "YAML Lint:    $YAML_LINT_RESULT"
          echo "Actions Lint: $ACTIONS_LINT_RESULT"
          echo "Zizmor:       $ZIZMOR_RESULT"

          has_failures=0

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::Detect job failed or was cancelled"
            has_failures=1
          fi

          if [[ "$YAML_LINT_RESULT" == "failure" || "$YAML_LINT_RESULT" == "cancelled" ]]; then
            echo "::error::YAML Lint failed or was cancelled"
            has_failures=1
          fi

          if [[ "$ACTIONS_LINT_RESULT" == "failure" || "$ACTIONS_LINT_RESULT" == "cancelled" ]]; then
            echo "::error::Actions Lint failed or was cancelled"
            has_failures=1
          fi

          if [[ "$ZIZMOR_RESULT" == "failure" || "$ZIZMOR_RESULT" == "cancelled" ]]; then
            echo "::error::Zizmor security scan failed or was cancelled"
            has_failures=1
          fi

          if [[ "$has_failures" -ne 0 ]]; then
            exit 1
          fi

          if [[ "$DETECT_CHANGED" == "false" ]]; then
            echo "Workflow linting skipped: no matching files changed"
          else
            echo "All workflow validations passed"
          fi
