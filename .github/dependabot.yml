---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      # Prefix configured to 'build' for action dependency updates
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 14
    # actions/checkout is deliberately held on the v5 line. From v6 onwards it
    # writes credentials via an includeIf "gitdir:" directive, which does not
    # match when a self-hosted runner's _work directory is a symlink, breaking
    # authentication (actions/checkout#2393, still open). v5.x updates are
    # still accepted, so security backports on that line keep flowing.
    ignore:
      - dependency-name: "actions/checkout"
        versions: [">= 6"]
